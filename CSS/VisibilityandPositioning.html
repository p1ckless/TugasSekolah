<!-- O. Visibility -->
<p>Paragraf ini terlihat di browser</p>
<p style="visibility:hidden;">Paragraf ini tidak terlihat di browser</p>

<!-- P. Positioning -->
<!-- 1. Relative -->
<div style="position:relative; left:80px; top:20px; background-color:yellow;">
    Layar ini menggunakan posisi relative
</div>

<!-- 2. Absolute -->
<div style="position:absolute; left:80px; top:20px; background-color:yellow;">
    Layar ini menggunakan posisi absolute
</div>

<!-- 3. Fixed -->
<div style="position:fixed; left:80px; top:20px; background-color:yellow;">
    Layar ini menggunakan posisi fixed
</div>
