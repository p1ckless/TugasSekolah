<!-- 10. Text-shadow -->
<p style="text-shadow:4px 4px 8px blue;">Jika browser Anda mendukung CSS maka tulisan ini akan menampilkan bayangan berwarna biru</p>

<!-- D. Image Control -->
<!-- 1. Border -->
<img style="border:3px dashed red;" src="/images/css.gif" />

<!-- 2. Height -->
<img style="border:1px solid red; height:100px;" src="/images/css.gif" /><br />
<img style="border:1px solid red; height:50%;" src="/images/css.gif" />

<!-- 3. Width -->
<img style="border:1px dotted red; width:100px;" src="/images/css.gif" /><br />
<img style="border:1px dotted red; width:50%;" src="/images/css.gif" />

<!-- 4. -moz-opacity (Transparansi) -->
<img style="border:3px solid red; -moz-opacity:0.4; filter:alpha(opacity=40);" src="/images/css.gif" />
