<html>
<body>
<script type="text/javascript">
var dt1 = Date(); 
var dt2 = new Date("March 25, 2015 23:15:00");

document.write("Date and Time: " + dt1 + "<br>");
document.write("getDate(): " + dt2.getDate() + "<br>");
document.write("getTime: " + dt2.getTime() + "<br>");
document.write("getUTCDate: " + dt2.getUTCDate() + "<br>");
document.write("setFullYear: " + dt2.setFullYear(2016) + "<br>");
document.write("setHours: " + dt2.setHours(2));
</script>
</body>
</html>
