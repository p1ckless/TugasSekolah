<html>
<head>
<script type="text/javascript">
function cekumur() {
    var age = document.kontrol.umur.value;
    if (parseInt(age) == 18) {
        document.getElementById("hasil").innerHTML = "<b>Umur Anda 18 tahun</b>";
    } else if (parseInt(age) == 19) {
        document.getElementById("hasil").innerHTML = "<b>Umur Anda 19 tahun</b>";
    } else if (parseInt(age) == 20) {
        document.getElementById("hasil").innerHTML = "<b>Umur Anda 20 tahun</b>";
    } else {
        document.getElementById("hasil").innerHTML = "<b>Umur Anda bukan 18, 19, atau 20 tahun</b>";
    }
}
</script>
</head>
<body>
<form name="kontrol" method="post">
Input Umur: <input type="text" name="umur">
<input type="button" value="Cek Umur" onclick="cekumur()">
</form>
<p id="hasil"></p>
</body>
</html>
