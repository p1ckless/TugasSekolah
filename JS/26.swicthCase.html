<html>
<body>
<script type="text/javascript">
var grade = 'A';
switch (grade) {
    case 'A': document.write("Baik Sekali"); break;
    case 'B': document.write("Baik"); break;
    case 'C': document.write("Cukup"); break;
    case 'D': document.write("Kurang"); break;
    case 'E': document.write("Kurang Sekali"); break;
    default: document.write("Nilai Grade Salah");
}
</script>
</body>
</html>
